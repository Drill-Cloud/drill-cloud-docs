site_name: Drill Cloud Docs
site_description: Архитектура, локальная разработка и тестирование Drill Cloud
site_url: https://drill-cloud.github.io/drill-cloud-docs/
repo_url: https://github.com/Drill-Cloud/drill-cloud-docs
repo_name: Drill-Cloud/drill-cloud-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

nav:
  - Главная: index.md
  - Локальный контур: local-development.md
  - Сервисы и окружение: services.md
  - Наблюдаемость:
      - Карта и назначение: observability/index.md
      - Как пользоваться Grafana: observability/grafana-ui.md
      - Бизнес-дашборды:
          - Обзор и доступность: observability/business/overview.md
          - DEV, ALPHA и PROD: observability/business/environments.md
          - Общие сервисы: observability/business/shared-services.md
          - PostgreSQL: observability/business/postgresql.md
      - Инфраструктура:
          - Сервер: observability/infrastructure/host.md
          - Docker-контейнеры: observability/infrastructure/containers.md
          - Система мониторинга: observability/infrastructure/monitoring-stack.md
          - Инфраструктурные логи: observability/infrastructure/logs.md
      - Расследование инцидентов: observability/incident-response.md
  - Автотестирование:
      - Обзор: testing/index.md
      - Ручной запуск в GitHub Actions: testing/github-actions.md
      - Окружения и секреты: testing/environments.md
      - Профили и покрытие: testing/profiles.md
      - Тестовые данные: testing/test-data.md
      - Результаты в ReportPortal: testing/reportportal.md
      - Диагностика ошибок: testing/troubleshooting.md
  - Работа с документацией:
      - Git submodule: submodules.md

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

copyright: Drill Cloud
