site_name: Drill Cloud Docs
site_description: Архитектура, локальная разработка и тестирование Drill Cloud
site_url: https://drill-cloud.github.io/drill-cloud-docs/
repo_url: https://github.com/Drill-Cloud/drill-cloud-docs
repo_name: Drill-Cloud/drill-cloud-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

nav:
  - Главная: index.md
  - Локальный контур: local-development.md
  - Сервисы и окружение: services.md
  - Тестирование: testing.md
  - Работа с документацией:
      - Git submodule: submodules.md
      - Публикация MkDocs: deployment.md

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

copyright: Drill Cloud
